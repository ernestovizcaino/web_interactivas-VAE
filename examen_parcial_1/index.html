<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieReviews · Películas Destacadas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-movie sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-film text-primary"></i> Movie<span class="text-primary">Reviews</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link active" href="index.html"><i class="bi bi-house-door-fill"></i> Inicio</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-link nav-link btn-favoritos" type="button" data-bs-toggle="modal"
              data-bs-target="#modalFavoritos">
              <i class="bi bi-heart"></i> Favoritos
              <span class="badge rounded-pill text-bg-danger contador-favoritos">0</span>
            </button>
          </li>
        </ul>

        <form class="d-flex ms-lg-3 my-2 my-lg-0" role="search" onsubmit="return false;">
          <input class="form-control form-control-sm" type="search" id="inputBuscar" placeholder="Buscar película..."
            aria-label="Buscar película">
        </form>
      </div>
    </div>
  </nav>

  <main class="container py-5">

    <header class="text-center mb-4">
      <h1 class="fw-bold display-5">
        <i class="bi bi-film text-primary"></i> Películas <span class="text-primary">Destacadas</span>
      </h1>
      <p class="text-muted">Las mejores películas según la crítica y el público</p>
    </header>

    <div class="d-flex flex-wrap justify-content-center gap-2 mb-4" id="filtros">
      <button type="button" class="btn btn-sm btn-primary rounded-pill filtro activo" data-desde="0" data-hasta="9999">Todos</button>
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro" data-desde="1990" data-hasta="1999">1990-1999</button>
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro" data-desde="2000" data-hasta="2009">2000-2009</button>
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro" data-desde="2010" data-hasta="2019">2010-2019</button>
      <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill filtro" data-desde="2020" data-hasta="2026">2020-2026</button>
    </div>

    <div class="text-center py-5" id="spinner">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="text-muted mt-3 mb-0">Cargando películas...</p>
    </div>

    <div class="alert alert-danger text-center d-none" id="mensajeError" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-3 d-block mb-2"></i>
      <p class="mb-3">No se pudieron cargar las películas. Revisa tu conexión e inténtalo de nuevo.</p>
      <button class="btn btn-danger" type="button" id="btnReintentar">
        <i class="bi bi-arrow-clockwise"></i> Reintentar
      </button>
    </div>

    <div class="text-center text-muted py-5 d-none" id="sinResultados">
      <i class="bi bi-search fs-1 d-block mb-2"></i>
      <p class="mb-0">No se encontraron películas con ese criterio</p>
    </div>

    <div class="row g-4" id="gridPeliculas"></div>

  </main>

  <div class="modal fade" id="modalFavoritos" tabindex="-1" aria-labelledby="tituloModalFavoritos" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModalFavoritos">
            <i class="bi bi-heart-fill text-danger"></i> Mis Favoritos
            <span class="badge rounded-pill text-bg-danger contador-favoritos">0</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3" id="gridFavoritos"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-danger btn-sm" id="btnEliminarTodos">
            <i class="bi bi-trash"></i> Eliminar todos
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="favoritos.js"></script>
  <script src="index.js"></script>
</body>

</html>
