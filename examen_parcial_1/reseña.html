<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieReviews · Reseña</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark navbar-movie sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <i class="bi bi-film text-primary"></i> Movie<span class="text-primary">Reviews</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
        aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="index.html"><i class="bi bi-house-door-fill"></i> Inicio</a>
          </li>
          <li class="nav-item">
            <button class="btn btn-link nav-link btn-favoritos" type="button" data-bs-toggle="modal"
              data-bs-target="#modalFavoritos">
              <i class="bi bi-heart"></i> Favoritos
              <span class="badge rounded-pill text-bg-danger contador-favoritos">0</span>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">

    <div class="text-center py-5" id="spinner">
      <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="text-muted mt-3 mb-0">Cargando información de la película...</p>
    </div>

    <div class="alert alert-danger text-center d-none" id="mensajeError" role="alert">
      <i class="bi bi-exclamation-triangle-fill fs-3 d-block mb-2"></i>
      <p class="mb-3" id="textoError">No se encontró la información de esta película.</p>
      <button class="btn btn-danger me-2" type="button" id="btnReintentar">
        <i class="bi bi-arrow-clockwise"></i> Reintentar
      </button>
      <a class="btn btn-outline-danger" href="index.html"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
    </div>

    <div class="card border-0 shadow-sm d-none" id="detalle">
      <div class="card-body p-4">
        <div class="row g-4">

          <div class="col-12 col-md-4">
            <img src="" alt="Póster de la película" class="rounded shadow-sm poster-detalle" id="imagen">
          </div>

          <div class="col-12 col-md-8">

            <div class="d-flex justify-content-between align-items-start gap-2">
              <h1 class="fw-bold h2 mb-2" id="titulo"></h1>
              <button type="button" class="btn btn-outline-danger btn-sm text-nowrap" id="btnFavoritoDetalle">
                <i class="bi bi-heart"></i> Favorito
              </button>
            </div>

            <p class="text-muted small mb-3" id="metaDatos"></p>

            <div class="d-flex align-items-center flex-wrap gap-2 bg-light rounded p-2 mb-3" id="calificacion"></div>

            <div class="mb-3 d-none" id="bloqueMetascore">
              <p class="dato-titulo mb-1">Metascore: <span class="fw-bold" id="metascoreValor"></span></p>
              <div class="progress metascore-barra">
                <div class="progress-bar" id="metascoreBarra" role="progressbar" style="width: 0%"></div>
              </div>
            </div>

            <p class="dato-titulo mb-1">Géneros</p>
            <div class="mb-3" id="generos"></div>

            <blockquote class="sinopsis fst-italic small rounded p-3 mb-3" id="sinopsis"></blockquote>

            <p class="dato-titulo mb-1">Intereses</p>
            <div class="mb-3" id="intereses"></div>

            <div class="row g-3 border-top pt-3 mb-3" id="datos"></div>

            <div class="d-flex flex-wrap gap-2 mb-3">
              <a href="#" target="_blank" rel="noopener" class="btn btn-danger btn-sm d-none" id="btnTrailer">
                <i class="bi bi-play-fill"></i> Ver tráiler
              </a>
              <a href="index.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver
              </a>
            </div>

            <div id="bloqueEnlaces" class="d-none">
              <p class="dato-titulo mb-1">Enlaces externos</p>
              <div class="d-flex flex-wrap gap-3 small" id="enlaces"></div>
            </div>

          </div>
        </div>
      </div>
    </div>

  </main>

  <div class="modal fade" id="modalFavoritos" tabindex="-1" aria-labelledby="tituloModalFavoritos" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModalFavoritos">
            <i class="bi bi-heart-fill text-danger"></i> Mis Favoritos
            <span class="badge rounded-pill text-bg-danger contador-favoritos">0</span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3" id="gridFavoritos"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
          <button type="button" class="btn btn-danger btn-sm" id="btnEliminarTodos">
            <i class="bi bi-trash"></i> Eliminar todos
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="favoritos.js"></script>
  <script src="resena.js"></script>
</body>

</html>
